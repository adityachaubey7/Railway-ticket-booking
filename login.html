<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RailEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Login to RailEase</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Enter email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-field">
            <input type="password" id="loginPassword" placeholder="Enter password" required />
            <button type="button" class="password-toggle" id="loginToggle">Show</button>
          </div>
        </div>
        <button class="btn" style="width:100%">Login</button>
      </form>
      <div class="auth-footer">Don't have an account? <a href="signup.html">Signup</a></div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
