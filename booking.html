<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking - RailEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">Rail<span>Ease</span></div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="search.html">Search Trains</a>
        <a href="mybookings.html">My Bookings</a>
        <span id="authSlot"></span>
      </div>
    </div>
  </nav>

  <div class="container section">
    <h2 class="section-title">Choose Your Seat & Passenger Details</h2>
    <div class="booking-grid">
      <div class="card">
        <h3>Select a Seat</h3>
        <p class="train-meta">Selected seat: <strong id="selectedSeatLabel">None</strong></p>
        <div class="seat-map" id="seatMap"></div>

        <form id="bookingForm">
          <div class="passenger-row mt-20">
            <div class="form-group">
              <label>Passenger Name</label>
              <input type="text" id="passengerName" required />
            </div>
            <div class="form-group">
              <label>Age</label>
              <input type="number" id="passengerAge" min="1" max="100" required />
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select id="passengerGender" required>
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="passenger-row mt-20">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="passengerEmail" required />
            </div>
            <div class="form-group">
              <label>Mobile Number</label>
              <input type="tel" id="passengerMobile" maxlength="10" required />
            </div>
          </div>
          <div class="mt-20">
            <button class="btn">Proceed to Payment</button>
          </div>
        </form>
      </div>

      <div class="summary-box" id="bookingSummary"></div>
    </div>
  </div>

  <footer class="footer"><div class="container"><p>© <span id="year"></span> RailEase</p></div></footer>

  <script src="js/common.js"></script>
  <script src="js/trains.js"></script>
  <script src="js/booking.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
